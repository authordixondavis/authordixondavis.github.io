const pages=[
`<div class="chapter">PROLOGUE</div><div class="text"><p>The ringing of an unanswered phone echoed endlessly through Jackson Corvin’s mind.</p><p class="break">Again.<br>Again.<br>Again.</p><p>Somewhere deep inside the dream, he already knew what it meant. He understood this was memory replaying itself like a cruel ritual his subconscious refused to forgive. Even after all the years of trying to forget the pain, the emptiness, and knowing she will never answer, still part of him continues to wait, hoping she would.</p><p class="break">Just once.</p><p>To hear her sweet voice. One soft little laugh. One sleepy good morning,</p><p>He’d give anything to hear her one last time.</p><p>But he understood better than anyone that some calls will never get answered.</p><p>He had made certain of that with that same call.</p></div>`,
`<div class="text"><p>He was fully aware of his state of mind and he tried desperately to will himself awake. Even screaming at the visual self image he no longer recognized.</p><p class="break">Wake up!<br>Snap out of it!<br>Get up stupid!</p><p>The dream was in control not him. Knowledge of the dream was useless he never could wake himself. This nightmare was powered from somewhere he could not access.</p><p>The words echoed through his mind overlapping as they repeat themselves, sleep held him in place like wet concrete. He could feel a wave of panic about to swallow him. Then a voice surfaced from the darkness. Not his own. Someone else. Someone familiar, even if he didn’t recognize it immediately</p><p>Bruce. That was the voice.</p><p>Steady, calm, and reassuringly purposeful.</p></div>`,
`<div class="text"><p class="dialogue">“Breathe, son. I know it ain’t going good for you now, like you got the weight of the world on your back, and I hate to add to it, but it’s going to get worse before it gets better. You’re stronger than you know and I got faith you’ll figure it out son. You we’re built for this son.”</p><p>The voice drifted and started to fade, as another thought pushed violently to the surface.</p><p class="break">August 1st the same but different.</p><p>His chest tightened, panic taking hold.</p><p class="dialogue">“No,” Jackson whispered somewhere inside the tangled visions. “Dad please don’t go. I don’t know what I’m supposed to do. I scared. Please don’t leave me.”</p><p>As the voice drifted farther away Jackson heard the last of it “Its all about timing boy, don’t grind’em, just float them. It’s all about timing and it’s all connected to everything else?”</p><p class="dialogue">“What the hell is that supposed to mean?”</p></div>`,
`<div class="text"><p>The darkness replied only with silence. His dad had been gone for decades. Another victim of bad circumstance and the tormentor of his soul, Jackson recognized it simply by 801.</p><p>Then another thought crept slowly in like smoke beneath a door. The thought filled the room and expanding until it wasn’t a room but now his mind. 801 is only an avatar, a physical representation of an entity that shows no mercy, it just one of countless faces it wears. Its true face, no one has seen. It existed long before men had given it a name.</p><p>A sharp metallic sound cutting through the dream. “Oh what new hell is this?” Jackson cried out.</p><p>He was exhausted, these last few years he’d seen little rest.</p><p>Nightmare after nightmare always pleading. “Just once please God let me dream of her. Let me see her face, just” …… the Metallic sound more insistent now and breaking his thoughts. The sound isn’t a memory he realized.</p><p class="break">Not this time.</p><p>He recognized it.</p><p class="break">Reality. Swirling into focus.</p></div>`,
`<div class="text"><p>Brass keys rapping against the steel frame of his bunk.</p><p>Jackson’s eyes flew open.</p><p>A correctional officer standing at the foot of his bunk the dim hallway light stretching into his cell like shadow puppets from a Tim Burton nightmare. Usually, prison guards barked orders with practiced indifference, but tonight the voice soft and carried something else.</p><p class="break">Compassion maybe?</p><p>Or maybe it was pity? He settled on both.</p><p class="dialogue">“Jackson” she said quietly. “The chaplain needs to see you in his office.”</p><p>Jackson sat upright too quickly. Head spinning and terror taking over. These after hour summons only could mean one thing.</p><p>His pulse was already racing before his hand even reached for the tablet beside him. Please God… not her too. He pressed the power button, light erupted around him as the glow of the face allowed him to see, staring back at him he saw it and also saw, what wasn’t there, the reply to the message he’d sent before laying down and his momma always replied. Above the empty message box sat the number 8:01.</p></div>`,
`<div class="text"><p>Fulfilling some sort of twisted prophecy.</p><p>Mocking him, taunting him, and tormenting him.</p><p>God would not be answering his request this night.</p><p>He knew what was lurking in the chaplain’s office. The clock on his tablet had just confirmed it.</p><p>Quickly, he pressed the power button. As if the speed of movement could somehow undo what had already occurred.</p><p>The light that had lit the darkness around him was gone from the screen now, as well as the numbers that haunted him. He knew they were never truly gone 8:01 is patient, it has no need to rush. Like a relentless hunter stalking its prey, his stomach tightened at that mental image.</p><p>For a moment, he couldn’t breathe.</p><p>It felt as though death itself had decided he should suffer over and over, taking please in his misery. Maybe as payback feeling cheated so ma years before by Jackson.</p></div>`,
`<div class="text"><p class="break">A poorly timed phone call.<br>A highway route or mile marker.<br>A date on the calendar.<br>A hospital room.<br>And now, the time the prison chaplain summoned him to his office after hours.</p><p>The scenarios changed but the number remained.</p><p>Most of the time a number is just a number, the other side of the coin it’s something more frightening. It can haunt a person. If not careful it can consume them.</p><p>This would be the other side for Jackson. He had always known the truth, death wasn’t the number, death was just a servant. The number just an avatar the entity in question would out last everything. You can’t beat it.</p><p class="break">No one, nothing at all, can escape it.</p><p class="finalline">Because time will eventually claim us all.</p></div>`
];
